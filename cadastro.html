<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro de Produtos - Mercadinho</title>
    
    <!-- Supabase CDN -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- HTML5 QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --text: #0f172a;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--white);
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .btn-voltar-topo {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .titulo-topo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        #reader {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            display: none; 
            border: 2px solid var(--primary);
        }

        .btn-scan {
            width: 100%;
            background-color: #475569;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
        }

        .swal2-popup { border-radius: 15px !important; }
    </style>
</head>
<body>

    <header>
        <button class="btn-voltar-topo" onclick="window.location.href='menu.html'" title="Voltar ao Menu">⬅️</button>
        <span class="titulo-topo">Cadastro de Produtos</span>
        <div style="width: 45px;"></div>
    </header>

    <main>
        <div class="container">
            <div class="form-group">
                <label for="codigo_barras">Código de Barras (EAN)</label>
                <input type="text" id="codigo_barras" placeholder="Ex: 7891024037973" onchange="buscarProdutoAPI(this.value)">
                
                <div id="reader"></div>
                
                <button type="button" class="btn-scan" id="btn-toggle-scan">📸 ESCANEAR CÓDIGO</button>
            </div>

            <div class="form-group">
                <label for="nome">Nome do Produto (Editável)</label>
                <input type="text" id="nome" placeholder="Nome carregará automaticamente ou digite">
            </div>

            <div class="form-group">
                <label for="preco_venda">Preço de Venda (R$)</label>
                <input type="text" id="preco_venda" placeholder="R$ 0,00" onkeyup="formatarMoeda(this)">
            </div>

            <button class="btn-save" onclick="salvarProduto()">💾 SALVAR PRODUTO</button>
        </div>
    </main>

    <script>
    
        const SUPABASE_URL = "https://lwakjpkjieswatbmukdy.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3YWtqcGtqaWVzd2F0Ym11a2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODg5MzUsImV4cCI6MjEwMjg2NDkzNX0.YIyrALi9r7ZZzN2Diuili-JRewuimKXU7DDDluhoEPM";
        
        const tabela_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let html5QrCode;
        let produtoExistenteId = null; // Controla se vamos SALVAR (novo) ou ATUALIZAR (existente)

        const readerDiv = document.getElementById('reader');
        const btnScan = document.getElementById('btn-toggle-scan');
        const inputCodigo = document.getElementById('codigo_barras');
        const inputNome = document.getElementById('nome');
        const inputPreco = document.getElementById('preco_venda');
        const btnSave = document.querySelector('.btn-save');

        // --- BUSCA INTELIGENTE (LOCAL + API BRASILEIRA) ---
        async function buscarProdutoAPI(ean) {
            if (!ean || ean.length < 8) return;
            
            inputNome.placeholder = "Buscando produto...";
            produtoExistenteId = null; // Reseta o estado
            btnSave.innerHTML = "💾 SALVAR PRODUTO";
            btnSave.style.backgroundColor = "var(--success)";

            try {
                // CAMADA 1: Busca no banco de dados local (Supabase)
                const { data: prodLocal } = await tabela_supabase
                    .from('produtos')
                    .select('id, nome_produto, preco_venda')
                    .eq('codigo_barras', ean)
                    .maybeSingle();

                if (prodLocal) {
                    inputNome.value = prodLocal.nome_produto;
                    if (prodLocal.preco_venda) {
                        inputPreco.value = "R$ " + prodLocal.preco_venda.toFixed(2).replace('.', ',');
                    }
                    produtoExistenteId = prodLocal.id; // Salva o ID para atualizar depois
                    
                    btnSave.innerHTML = "🔄 ATUALIZAR PRODUTO";
                    btnSave.style.backgroundColor = "var(--primary)"; // Fica azul para indicar edição
                    
                    Swal.fire({
                        title: 'Já Cadastrado!',
                        text: 'Este produto já existe no seu estoque. Você pode atualizar o preço ou o nome.',
                        icon: 'info',
                        timer: 3000,
                        showConfirmButton: false
                    });
                    return; 
                }

                // CAMADA 2: Busca na base pública brasileira (Open Food Facts BR)
                const response = await fetch(`https://br.openfoodfacts.org/api/v0/product/${ean}.json`);
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    const nomeEncontrado = data.product.product_name_pt || data.product.product_name || "";
                    if (nomeEncontrado) {
                        inputNome.value = nomeEncontrado; 
                    } else {
                        inputNome.placeholder = "Não catalogado. Digite o nome.";
                    }
                } else {
                    inputNome.placeholder = "Não catalogado. Digite o nome.";
                }
            } catch (err) {
                console.log("Erro na consulta:", err);
                inputNome.placeholder = "Digite o nome manualmente.";
            }
        }

        // --- SCANNER ---
        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            readerDiv.style.display = 'block';
            btnScan.innerText = "🛑 PARAR CÂMERA";
            btnScan.classList.add('scanning');

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        inputCodigo.value = decodedText;
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopScanner();
                        buscarProdutoAPI(decodedText); 
                    },
                    (errorMessage) => { }
                );
            } catch (err) {
                stopScanner();
            }
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            readerDiv.style.display = 'none';
            btnScan.innerText = "📸 ESCANEAR CÓDIGO";
            btnScan.classList.remove('scanning');
        }

        btnScan.addEventListener('click', () => {
            if (readerDiv.style.display === 'none') startScanner();
            else stopScanner();
        });

        // Formata automaticamente o campo de preço
        function formatarMoeda(elemento) {
            let valor = elemento.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            elemento.value = valor === "0,00" ? "" : "R$ " + valor;
        }

        // --- SALVAR OU ATUALIZAR ---
        async function salvarProduto() {
            const codigo = inputCodigo.value.trim();
            const nome = inputNome.value.trim();
            let precoTexto = inputPreco.value;

            if (!codigo || !nome || !precoTexto) {
                Swal.fire('Atenção', 'Preencha todos os campos antes de salvar!', 'warning');
                return;
            }

            let precoNumero = parseFloat(precoTexto.replace("R$ ", "").replace(".", "").replace(",", "."));

            try {
                if (produtoExistenteId) {
                    // ATUALIZA produto existente
                    const { error } = await tabela_supabase
                        .from('produtos')
                        .update({ nome_produto: nome, preco_venda: precoNumero })
                        .eq('id', produtoExistenteId);
                    
                    if (error) throw error;
                    Swal.fire({ title: 'Atualizado!', text: 'Produto atualizado com sucesso!', icon: 'success', timer: 1500, showConfirmButton: false });
                
                } else {
                    // INSERE novo produto
                    const { error } = await tabela_supabase
                        .from('produtos')
                        .insert([{ codigo_barras: codigo, nome_produto: nome, preco_venda: precoNumero }]);
                    
                    if (error) throw error;
                    Swal.fire({ title: 'Sucesso!', text: 'Produto cadastrado!', icon: 'success', timer: 1500, showConfirmButton: false });
                }

                limparFormulario();
            } catch (err) {
                Swal.fire('Erro', 'Falha ao salvar: ' + err.message, 'error');
            }
        }

        function limparFormulario() {
            inputCodigo.value = "";
            inputNome.value = "";
            inputPreco.value = "";
            inputNome.placeholder = "Ex: Farinha de Mandioca 1kg";
            produtoExistenteId = null;
            
            btnSave.innerHTML = "💾 SALVAR PRODUTO";
            btnSave.style.backgroundColor = "var(--success)";
            
            if (readerDiv.style.display !== 'none') stopScanner();
        }
    </script>
</body>
</html>
