<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Acesso - Mercadinho Elshaday</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #357c65; --bg: #f8fafc; --text: #0f172a; --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--primary); /* Fundo azul moderno para login */
            display: flex; flex-direction: column; height: 100vh; height: 100dvh; 
            align-items: center; padding: 20px;
        }

        .header-login { margin-top: 40px; margin-bottom: 30px; text-align: center; color: white;}
        .app-title { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;}
        .app-subtitle { font-size: 1rem; font-weight: 600; opacity: 0.9; margin-top: 5px; }

        .login-container { 
            background: var(--white); width: 100%; max-width: 400px; border-radius: 20px; 
            padding: 25px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; gap: 15px; overflow-y: auto; max-height: 70vh;
        }

        .login-instrucao { text-align: center; color: #64748b; font-weight: 800; font-size: 1.1rem; margin-bottom: 10px; }

        /* Lista de Usuários */
        .user-btn {
            background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 15px; 
            padding: 15px; display: flex; align-items: center; gap: 15px; 
            cursor: pointer; transition: 0.2s; text-align: left; width: 100%;
        }
        .user-btn:active { transform: scale(0.97); border-color: var(--primary); background: #eff6ff;}
        
        .user-avatar { 
            width: 50px; height: 50px; border-radius: 12px; background: var(--primary); 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; font-weight: 900; flex-shrink: 0;
        }
        
        .user-info { flex: 1; }
        .user-nome { font-size: 1.1rem; font-weight: 800; color: var(--text); }
        .user-perfil { font-size: 0.8rem; font-weight: 600; color: #64748b; margin-top: 2px; }

        .swal2-popup { border-radius: 20px !important; }
        .swal2-input { text-align: center !important; font-size: 1.5rem !important; font-weight: bold !important; letter-spacing: 5px !important;}
    </style>
</head>
<body>

    <div class="header-login">
        <div class="app-title">Mercadinho</div>
        <div class="app-subtitle">Terminal de Vendas & Gestão</div>
    </div>

    <div class="login-container" id="box-usuarios">
        <div class="login-instrucao">Toque no seu nome para entrar:</div>
        
        <div id="lista-usuarios">
            <div style="text-align: center; padding: 20px; color: #64748b;">Carregando usuários...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lwakjpkjieswatbmukdy.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3YWtqcGtqaWVzd2F0Ym11a2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODg5MzUsImV4cCI6MjEwMjg2NDkzNX0.YIyrALi9r7ZZzN2Diuili-JRewuimKXU7DDDluhoEPM";
        const tabela_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Se já estiver logado, pula direto pro menu
        if (localStorage.getItem('usuario_mercadinho')) {
            window.location.href = 'menu.html';
        }

        async function carregarUsuarios() {
            try {
                const { data, error } = await tabela_supabase
                    .from('usuarios')
                    .select('id, nome, perfil')
                    .order('nome', { ascending: true });

                if (error) throw error;

                const container = document.getElementById('lista-usuarios');
                
                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #dc2626; font-weight: bold;">
                            Nenhum usuário encontrado.<br>Acesse o Supabase para criar o primeiro administrador.
                        </div>`;
                    return;
                }

                container.innerHTML = data.map(user => {
                    // Pega a primeira letra do nome para o Avatar
                    const inicial = user.nome.charAt(0).toUpperCase();
                    const perfilFormatado = user.perfil === 'adm_sistema' ? 'Administrador' : 'Colaborador';
                    
                    return `
                        <button class="user-btn" onclick="abrirSenha('${user.id}', '${user.nome}', '${user.perfil}')">
                            <div class="user-avatar">${inicial}</div>
                            <div class="user-info">
                                <div class="user-nome">${user.nome}</div>
                                <div class="user-perfil">${perfilFormatado}</div>
                            </div>
                        </button>
                    `;
                }).join('');

            } catch (err) {
                Swal.fire('Erro de Conexão', 'Não foi possível buscar a lista de usuários. Verifique sua internet.', 'error');
                console.error(err);
            }
        }

        async function abrirSenha(id, nome, perfil) {
            const { value: pinDigitado } = await Swal.fire({
                title: `Olá, ${nome.split(' ')[0]}!`,
                text: 'Digite seu PIN de acesso:',
                input: 'password',
                // inputmode numeric força abrir o teclado numérico grande do celular
                inputAttributes: { maxlength: 6, inputmode: 'numeric', pattern: '[0-9]*' },
                showCancelButton: true,
                confirmButtonText: 'Entrar',
                cancelButtonText: 'Voltar',
                confirmButtonColor: '#2563eb'
            });

            if (pinDigitado) {
                fazerLogin(id, nome, perfil, pinDigitado);
            }
        }

        async function fazerLogin(id, nome, perfil, pin) {
            Swal.fire({ title: 'Autenticando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // Checa no banco se aquele PIN pertence àquele usuário específico
                const { data, error } = await tabela_supabase
                    .from('usuarios')
                    .select('id')
                    .eq('id', id)
                    .eq('pin_senha', pin)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    // Senha correta! Salva na memória do celular
                    const usuario = { id, nome, perfil };
                    localStorage.setItem('usuario_mercadinho', JSON.stringify(usuario));
                    
                    Swal.fire({ title: 'Acesso Liberado!', icon: 'success', timer: 1000, showConfirmButton: false }).then(() => {
                        window.location.href = 'menu.html';
                    });
                } else {
                    Swal.fire('Acesso Negado', 'PIN incorreto. Tente novamente.', 'error');
                }

            } catch (err) {
                Swal.fire('Erro', 'Falha ao tentar conectar com o banco de dados.', 'error');
            }
        }

        // Carrega a lista assim que a página abrir
        carregarUsuarios();
    </script>
</body>
</html>
