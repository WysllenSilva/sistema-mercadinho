<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Principal - Mercadinho</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --text: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 40px;
            margin-top: 20px;
            color: var(--text);
            text-transform: uppercase;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .btn-menu {
            width: 100%;
            padding: 30px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .btn-pdv { background-color: var(--primary); }
        .btn-cad { background-color: var(--success); }
        .btn-est { background-color: var(--success); }
        .btn-sair { background-color: var(--danger); margin-top: 40px; }

        .btn-menu:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>MERCADINHO</h1>

    <div class="menu-grid">
        <button class="btn-menu btn-pdv" onclick="window.location.href='venda.html'">
            🛒 Vender (PDV)
        </button>
        
        <button class="btn-menu btn-cad" onclick="window.location.href='produtos.html'">
            📦 Cadastro de Produto
        </button>

        <button class="btn-menu btn-est" onclick="window.location.href='prateleira.html'">
            📦 Estoque
        </button>

        <button class="btn-menu btn-est" onclick="window.location.href='movimentacoes.html'">
            📦 Abastecimento de produtos
        </button>

        <button class="btn-menu btn-sair" onclick="window.location.href='index.html'">
            🚪 Sair
        </button>
    </div>

</body>
</html>
