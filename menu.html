<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Menu Principal - Mercadinho Elshaday</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626;
            --bg: #f8fafc; --text: #0f172a; --white: #ffffff;
            --gray-light: #e2e8f0; --admin-color: #7c3aed; --admin-dark: #4f46e5;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* Estrutura de "Sanduíche" travada na tela */
        html, body { 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            height: 100dvh; /* Altura exata do celular */
            overflow: hidden; /* Trava rolagem geral */
        }

        /* Topo Fixo */
        .header-area {
            padding: 25px 15px 10px 15px;
            flex-shrink: 0;
            background-color: var(--bg);
            z-index: 10;
        }
        .app-title { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 5px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
        .user-welcome { font-size: 0.95rem; color: #64748b; font-weight: 600; text-align: center; }

        /* Miolo Rolável (onde ficam os botões) */
        .menu-container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto; /* Rolagem apenas aqui dentro */
            flex: 1; 
            padding: 15px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Botões com tamanho original restaurado */
        .btn-menu { 
            border: none; border-radius: 12px; padding: 22px 10px; font-size: 1.1rem; font-weight: 800; 
            cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            text-decoration: none; color: white; transition: transform 0.1s;
        }
        .btn-menu:active { transform: scale(0.96); }
        .btn-menu i { font-size: 1.8rem; font-style: normal; }

        .btn-vender { background-color: var(--success); }
        .btn-historico { background-color: var(--gray-light); color: var(--text); }
        .btn-acao { background-color: var(--primary); } 
        .btn-usuarios { background-color: var(--admin-color); } 
        .btn-configs { background-color: var(--admin-dark); } 

        .divider { height: 2px; background-color: #cbd5e1; margin: 5px 0; border-radius: 2px; }

        /* Rodapé Fixo (Botão Sair) */
        .footer-action { 
            width: 100%; 
            background: var(--white);
            padding: 15px; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); /* Margem p/ barra do iPhone/Android */
            flex-shrink: 0; 
            display: flex; 
            justify-content: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05); 
            z-index: 10;
        }
        .btn-sair { 
            background-color: var(--danger); color: white; border: none; border-radius: 10px; 
            padding: 15px 20px; font-size: 1.1rem; font-weight: 800; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 500px;
        }
        .btn-sair:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- CABEÇALHO FIXO -->
    <div class="header-area">
        <h1 class="app-title">MERCADINHO</h1>
        <div id="welcome-msg" class="user-welcome">Carregando usuário...</div>
    </div>

    <!-- MIOLO COM ROLAGEM -->
    <div class="menu-container">
        <div class="grid-2">
            <a href="vendas.html" class="btn-menu btn-vender"><i>🛒</i> VENDER</a>
            <a href="historico.html" class="btn-menu btn-historico"><i>📄</i> HISTÓRICO</a>
        </div>

        <div class="divider"></div>

        <div class="grid-2">
            <a href="produtos.html" class="btn-menu btn-acao"><i>📦</i> PRODUTOS</a>
            <a href="movimentacoes.html" class="btn-menu btn-acao"><i>📥</i> ESTOQUE</a>
        </div>
        
        <a href="prateleira.html" class="btn-menu btn-acao" style="width: 100%;"><i>🏷️</i> PRATELEIRA / VALIDADES</a>

        <div id="slot-admin" class="grid-2" style="margin-top: 5px;"></div>
    </div>

    <!-- RODAPÉ FIXO -->
    <div class="footer-action">
        <button class="btn-sair" onclick="fazerLogout()">❌ SAIR DO SISTEMA</button>
    </div>

    <script>
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario_mercadinho'));

        if (!usuarioLogado) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcome-msg').innerText = `Logado como: ${usuarioLogado.nome} (${usuarioLogado.perfil === 'adm_sistema' ? 'Administrador' : 'Colaborador'})`;

            if (usuarioLogado.perfil === 'adm_sistema') {
                document.getElementById('slot-admin').innerHTML = `
                    <div class="divider" style="grid-column: span 2;"></div>
                    <a href="relatorios.html" class="btn-menu" style="background-color: #0ea5e9; grid-column: span 2;"><i>📊</i> PAINEL DE RELATÓRIOS</a>
                    <a href="usuarios.html" class="btn-menu btn-usuarios"><i>👥</i> USUÁRIOS</a>
                    <a href="configuracoes.html" class="btn-menu btn-configs"><i>⚙️</i> AJUSTES</a>
                `;
            }
        }

        function fazerLogout() {
            localStorage.removeItem('usuario_mercadinho');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
