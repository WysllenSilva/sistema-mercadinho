<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cadastro de Produtos - Mercadinho</title>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --warning: #f59e0b;
            --bg: #f8fafc; --text: #0f172a; --white: #ffffff; --gray: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        header { background: var(--white); padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; z-index: 10; flex-shrink: 0;}
        .btn-voltar-topo { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 10px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; text-decoration: none; color: var(--text);}
        .titulo-topo { font-size: 1.1rem; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; }

        main { flex: 1; overflow-y: auto; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); height: fit-content; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.95rem; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; outline: none; transition: border-color 0.2s; background: var(--white); }
        input:focus, select:focus { border-color: var(--primary); }
        
        /* Câmera */
        #reader { width: 100%; margin-bottom: 15px; border-radius: 12px; overflow: hidden; display: none; border: 2px solid var(--primary); }
        .btn-scan { width: 100%; background-color: #475569; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }

        /* Abas */
        .tabs { display: flex; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 2px solid #e2e8f0;}
        .tab-btn { flex: 1; padding: 12px 0; text-align: center; font-weight: 800; font-size: 0.9rem; color: var(--gray); cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Grids Internos */
        .grid-cat { display: flex; gap: 8px; }
        .btn-add-cat { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-3 label { font-size: 0.85rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .bloco-estoque-inicial { background: #f1f5f9; padding: 12px; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 15px; }
        .bloco-estoque-inicial h4 { font-size: 0.9rem; color: #475569; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }
        
        .btn-acao { width: 100%; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;}
        .btn-save-fast { background-color: var(--warning); color: #0f172a; }
        .btn-save-full { background-color: var(--success); }
        .btn-update { background-color: var(--primary); }

        #form-detalhes { display: none; margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 20px; }
        
        .swal2-actions { flex-wrap: wrap !important; gap: 5px; }
        .swal2-popup { border-radius: 15px !important; }
    </style>
</head>
<body>

    <header>
        <a href="menu.html" class="btn-voltar-topo" title="Voltar ao Menu">⬅️</a>
        <span class="titulo-topo">Cadastro de Produtos</span>
        <div style="width: 45px;"></div>
    </header>

    <main>
        <div class="container">
            <!-- CABEÇALHO DO PRODUTO (Sempre Visível) -->
            <div class="form-group" style="margin-bottom: 0;">
                <label for="codigo_barras">Código de Barras (EAN)</label>
                <input type="text" id="codigo_barras" placeholder="Bipe ou digite o código" oninput="checarDigitacao(this.value)" onchange="buscarProdutoAPI(this.value)">
                
                <div id="reader"></div>
                <button type="button" class="btn-scan" id="btn-toggle-scan">📸 ESCANEAR CÓDIGO</button>
            </div>

            <!-- ÁREA DE DADOS (Só aparece após bipar) -->
            <div id="form-detalhes">
                
                <!-- NAVEGAÇÃO DAS ABAS -->
                <div class="tabs">
                    <div class="tab-btn active" id="btn-tab-pre" onclick="mudarAba('pre')">⚡ PRÉ-CADASTRO</div>
                    <div class="tab-btn" id="btn-tab-comp" onclick="mudarAba('comp')">📝 COMPLETO</div>
                </div>

                <!-- ================= ABA 1: PRÉ-CADASTRO RÁPIDO ================= -->
                <div id="tab-pre" class="tab-content active">
                    <div class="form-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nome_pre" placeholder="Ex: Farinha de Mandioca">
                    </div>
                    <div class="form-group">
                        <label>Preço de Venda (R$) - Opcional</label>
                        <input type="text" id="preco_venda_pre" placeholder="0,00" onkeyup="formatarMoeda(this)">
                    </div>
                    <button class="btn-acao btn-save-fast" onclick="salvarPreCadastro()">⚡ SALVAR RÁPIDO</button>
                </div>

                <!-- ================= ABA 2: CADASTRO COMPLETO ================= -->
                <div id="tab-comp" class="tab-content">
                    <div class="form-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nome_comp" placeholder="Ex: Farinha de Mandioca">
                    </div>

                    <div class="form-group">
                        <label>Categoria</label>
                        <div class="grid-cat">
                            <select id="categoria_comp" style="flex: 1;">
                                <option value="">Carregando...</option>
                            </select>
                            <button type="button" class="btn-add-cat" onclick="adicionarNovaCategoria()">+</button>
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="form-group">
                            <label>Custo (R$)</label>
                            <input type="text" id="preco_custo_comp" placeholder="0,00" onkeyup="formatarMoeda(this); calcularPrecoVenda();">
                        </div>
                        <div class="form-group">
                            <label>Margem (%)</label>
                            <input type="number" id="porcentagem_lucro_comp" placeholder="0" onkeyup="calcularPrecoVenda()">
                        </div>
                        <div class="form-group">
                            <label>Venda (R$)</label>
                            <input type="text" id="preco_venda_comp" placeholder="0,00" onkeyup="formatarMoeda(this); calcularMargem();">
                        </div>
                    </div>

                    <div class="bloco-estoque-inicial" id="bloco-estoque-novo">
                        <h4>📦 Estoque Inicial (Opcional)</h4>
                        <div class="grid-2">
                            <div class="form-group" style="margin-bottom: 8px;">
                                <label>Quantidade</label>
                                <input type="number" id="ini_qtd" placeholder="Ex: 10" min="1">
                            </div>
                            <div class="form-group" style="margin-bottom: 8px;">
                                <label>Lote</label>
                                <input type="text" id="ini_lote" placeholder="Ex: L123">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Data Vencimento</label>
                            <input type="text" id="ini_vencimento" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" oninput="mascaraData(this)">
                        </div>
                    </div>

                    <!-- Botões Dinâmicos da Aba Completa -->
                    <button class="btn-acao btn-save-full" id="btn-salvar-comp" onclick="salvarCadastroCompleto()">💾 SALVAR E ESTOCAR</button>
                    <button class="btn-acao btn-update" id="btn-atualizar-comp" style="display: none;" onclick="salvarCadastroCompleto()">🔄 ATUALIZAR PRODUTO</button>
                </div>

            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://lwakjpkjieswatbmukdy.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3YWtqcGtqaWVzd2F0Ym11a2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODg5MzUsImV4cCI6MjEwMjg2NDkzNX0.YIyrALi9r7ZZzN2Diuili-JRewuimKXU7DDDluhoEPM";
        const tabela_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let html5QrCode;
        let produtoExistenteId = null; 

        const boxForm = document.getElementById('form-detalhes');
        const selectCategoria = document.getElementById('categoria_comp');

        // --- CONTROLE DE ABAS ---
        function mudarAba(aba) {
            document.getElementById('btn-tab-pre').classList.remove('active');
            document.getElementById('btn-tab-comp').classList.remove('active');
            document.getElementById('tab-pre').classList.remove('active');
            document.getElementById('tab-comp').classList.remove('active');

            document.getElementById(`btn-tab-${aba}`).classList.add('active');
            document.getElementById(`tab-${aba}`).classList.add('active');
        }

        function mascaraData(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 2) v = v.substring(0, 2) + "/" + v.substring(2);
            if (v.length > 5) v = v.substring(0, 5) + "/" + v.substring(5, 9);
            input.value = v;
        }

        async function carregarCategorias(categoriaSelecionada = "") {
            try {
                const { data } = await tabela_supabase.from('categorias').select('nome').order('nome', { ascending: true });
                if (data) {
                    selectCategoria.innerHTML = `<option value="">Selecione...</option>` + 
                        data.map(cat => `<option value="${cat.nome}" ${cat.nome === categoriaSelecionada ? 'selected' : ''}>${cat.nome}</option>`).join('');
                }
            } catch (err) { console.error(err); }
        }

        async function adicionarNovaCategoria() {
            const { value: novaCat } = await Swal.fire({ title: 'Nova Categoria', input: 'text', showCancelButton: true, confirmButtonText: 'Salvar' });
            if (novaCat && novaCat.trim() !== "") {
                const nomeFormatado = novaCat.trim();
                await tabela_supabase.from('categorias').insert([{ nome: nomeFormatado }]);
                await carregarCategorias(nomeFormatado);
            }
        }

        function checarDigitacao(ean) {
            if (ean.length >= 8) buscarProdutoAPI(ean);
            else boxForm.style.display = 'none'; 
        }

        function parseValor(s) { return parseFloat(s.replace("R$ ", "").replace(/\./g, "").replace(",", ".")) || 0; }
        function formataInputMoeda(v) { return v.toFixed(2).replace('.', ','); }
        
        function formatarMoeda(el) {
            let v = el.value.replace(/\D/g, "");
            v = (v / 100).toFixed(2).replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            el.value = v === "0,00" ? "" : v;
        }

        function calcularPrecoVenda() {
            let custo = parseValor(document.getElementById('preco_custo_comp').value);
            let margem = parseFloat(document.getElementById('porcentagem_lucro_comp').value) || 0;
            if (custo > 0 && margem >= 0) document.getElementById('preco_venda_comp').value = formataInputMoeda(custo + (custo * (margem / 100)));
        }

        function calcularMargem() {
            let custo = parseValor(document.getElementById('preco_custo_comp').value);
            let venda = parseValor(document.getElementById('preco_venda_comp').value);
            if (custo > 0 && venda > custo) document.getElementById('porcentagem_lucro_comp').value = Math.round(((venda - custo) / custo) * 100);
        }

        // --- FLUXO DE BUSCA E DEFINIÇÃO DA INTERFACE ---
        async function buscarProdutoAPI(ean) {
            if (!ean || ean.length < 8) return;

            try {
                const { data: prodLocal } = await tabela_supabase.from('produtos').select('*').eq('codigo_barras', ean).maybeSingle();

                if (prodLocal) {
                    boxForm.style.display = 'none';
                    
                    const resp = await Swal.fire({
                        title: 'Produto Localizado!',
                        text: `O item "${prodLocal.nome_produto}" já existe.`,
                        icon: 'info',
                        showCloseButton: true,
                        showCancelButton: false,
                        showDenyButton: true,
                        confirmButtonText: '📦 Ir para Estoque',
                        denyButtonText: '📝 Completar / Atualizar',
                        confirmButtonColor: '#2563eb',
                        denyButtonColor: '#64748b',
                        allowOutsideClick: true
                    });

                    if (resp.isConfirmed) {
                        window.location.href = `movimentacoes.html?ean=${ean}`;
                        return;
                    } else if (resp.isDenied) {
                        // FORÇA A ABA COMPLETO PARA ATUALIZAÇÃO
                        boxForm.style.display = 'block';
                        mudarAba('comp');
                        
                        produtoExistenteId = prodLocal.id;
                        
                        // Preenche formulário completo
                        document.getElementById('nome_comp').value = prodLocal.nome_produto || "";
                        await carregarCategorias(prodLocal.categoria || "");
                        document.getElementById('preco_custo_comp').value = prodLocal.preco_custo ? formataInputMoeda(prodLocal.preco_custo) : "";
                        document.getElementById('porcentagem_lucro_comp').value = prodLocal.porcentagem_lucro || "";
                        document.getElementById('preco_venda_comp').value = prodLocal.preco_venda ? formataInputMoeda(prodLocal.preco_venda) : "";
                        
                        // Preenche aba pré-cadastro por segurança
                        document.getElementById('nome_pre').value = prodLocal.nome_produto || "";
                        document.getElementById('preco_venda_pre').value = prodLocal.preco_venda ? formataInputMoeda(prodLocal.preco_venda) : "";
                        
                        document.getElementById('bloco-estoque-novo').style.display = 'none'; 
                        document.getElementById('btn-salvar-comp').style.display = 'none';
                        document.getElementById('btn-atualizar-comp').style.display = 'flex';
                    } else if (resp.isDismissed) {
                        limparFormulario();
                        setTimeout(() => document.getElementById('codigo_barras').focus(), 150);
                    }

                } else {
                    // PRODUTO NOVO: Força a aba PRÉ-CADASTRO
                    produtoExistenteId = null;
                    boxForm.style.display = 'block';
                    mudarAba('pre');
                    
                    document.getElementById('bloco-estoque-novo').style.display = 'block'; 
                    document.getElementById('btn-salvar-comp').style.display = 'flex';
                    document.getElementById('btn-atualizar-comp').style.display = 'none';
                    
                    await carregarCategorias("");

                    const response = await fetch(`https://br.openfoodfacts.org/api/v0/product/${ean}.json`);
                    const data = await response.json();
                    const nomeSugerido = (data.status === 1 && data.product) ? (data.product.product_name_pt || data.product.product_name || "") : "";
                    
                    // Preenche ambos os formulários para o usuário ter liberdade
                    document.getElementById('nome_pre').value = nomeSugerido;
                    document.getElementById('nome_comp').value = nomeSugerido;
                    
                    document.getElementById('preco_venda_pre').value = "";
                    document.getElementById('preco_custo_comp').value = "";
                    document.getElementById('porcentagem_lucro_comp').value = "";
                    document.getElementById('preco_venda_comp').value = "";
                    document.getElementById('ini_qtd').value = "";
                    document.getElementById('ini_lote').value = "";
                    document.getElementById('ini_vencimento').value = "";
                }
            } catch (err) { console.log(err); }
        }

        // --- SALVAMENTOS ---

        // 1. Ação da Aba Pré-Cadastro
        async function salvarPreCadastro() {
            const codigo = document.getElementById('codigo_barras').value.trim();
            const nome = document.getElementById('nome_pre').value.trim();
            const venda = parseValor(document.getElementById('preco_venda_pre').value); // Permite 0

            if (!codigo || !nome) {
                return Swal.fire('Atenção', 'Código e Nome são obrigatórios!', 'warning');
            }

            Swal.fire({ title: 'Salvando Rápido...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const payload = { codigo_barras: codigo, nome_produto: nome };
            if (venda > 0) payload.preco_venda = venda; // Só envia se informou

            try {
                if (produtoExistenteId) {
                    await tabela_supabase.from('produtos').update(payload).eq('id', produtoExistenteId);
                    Swal.fire({ title: 'Atualizado!', icon: 'success', timer: 1000, showConfirmButton: false });
                } else {
                    await tabela_supabase.from('produtos').insert([payload]);
                    Swal.fire({ title: 'Pré-Cadastro Salvo!', icon: 'success', timer: 1000, showConfirmButton: false });
                }
                limparFormulario();
                setTimeout(() => document.getElementById('codigo_barras').focus(), 500);
            } catch (err) { Swal.fire('Erro', err.message, 'error'); }
        }

        // 2. Ação da Aba Cadastro Completo
        async function salvarCadastroCompleto() {
            const codigo = document.getElementById('codigo_barras').value.trim();
            const nome = document.getElementById('nome_comp').value.trim();
            const categoria = selectCategoria.value;
            const custo = parseValor(document.getElementById('preco_custo_comp').value);
            const lucro = parseFloat(document.getElementById('porcentagem_lucro_comp').value) || 0;
            const venda = parseValor(document.getElementById('preco_venda_comp').value);

            if (!codigo || !nome || !venda) {
                return Swal.fire('Atenção', 'Código, Nome e Preço de Venda são obrigatórios no cadastro completo!', 'warning');
            }

            Swal.fire({ title: 'Processando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const payload = { codigo_barras: codigo, nome_produto: nome, categoria, preco_custo: custo, porcentagem_lucro: lucro, preco_venda: venda };

            try {
                if (produtoExistenteId) {
                    await tabela_supabase.from('produtos').update(payload).eq('id', produtoExistenteId);
                    Swal.fire({ title: 'Atualizado!', icon: 'success', timer: 1500, showConfirmButton: false });
                } else {
                    const { data: novoProd, error: errProd } = await tabela_supabase.from('produtos').insert([payload]).select().single();
                    if (errProd) throw errProd;

                    const qtdIni = parseInt(document.getElementById('ini_qtd').value);
                    const loteIni = document.getElementById('ini_lote').value.trim() || 'SEM LOTE';
                    const vencIniRaw = document.getElementById('ini_vencimento').value;

                    if (qtdIni > 0 && vencIniRaw) {
                        const partes = vencIniRaw.split('/');
                        const vencBanco = `${partes[2]}-${partes[1]}-${partes[0]}`;

                        await tabela_supabase.from('prateleira_fisica').insert([{ produto_id: novoProd.id, lote: loteIni, quantidade: qtdIni, data_vencimento: vencBanco }]);
                        await tabela_supabase.from('movimentacoes_estoque').insert([{ produto_id: novoProd.id, tipo: 'ENTRADA', quantidade: qtdIni, motivo: 'Estoque Inicial de Cadastro' }]);
                    }
                    Swal.fire({ title: 'Salvo Completo!', icon: 'success', timer: 1500, showConfirmButton: false });
                }
                limparFormulario();
                setTimeout(() => document.getElementById('codigo_barras').focus(), 500);
            } catch (err) { Swal.fire('Erro', err.message, 'error'); }
        }

        function limparFormulario() {
            document.getElementById('codigo_barras').value = "";
            produtoExistenteId = null;
            boxForm.style.display = 'none';
            if (document.getElementById('reader').style.display !== 'none') stopScanner();
        }

        // --- CÂMERA ---
        document.getElementById('btn-toggle-scan').addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            const btnScan = document.getElementById('btn-toggle-scan');
            if (readerDiv.style.display === 'none') {
                html5QrCode = new Html5Qrcode("reader");
                readerDiv.style.display = 'block';
                btnScan.innerHTML = "🛑 PARAR CÂMERA";
                html5QrCode.start(
                    { facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        document.getElementById('codigo_barras').value = decodedText;
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopScanner();
                        buscarProdutoAPI(decodedText);
                    }, () => {}
                ).catch(() => stopScanner());
            } else {
                stopScanner();
            }
        });

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('btn-toggle-scan').innerHTML = "📸 ESCANEAR CÓDIGO";
        }
    </script>
</body>
</html>
