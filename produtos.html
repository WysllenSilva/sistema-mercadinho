<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cadastro de Produtos - Mercadinho</title>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        
        :root {
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --warning: #f59e0b;
            --bg: #f8fafc; --text: #0f172a; --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        header { background: var(--white); padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .btn-voltar-topo { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 10px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .titulo-topo { font-size: 1.1rem; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; }

        main { flex: 1; overflow-y: auto; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); height: fit-content; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.95rem; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; outline: none; transition: border-color 0.2s; background: var(--white); }
        input:focus, select:focus { border-color: var(--primary); }
        
        .grid-cat { display: flex; gap: 8px; }
        .btn-add-cat { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-3 label { font-size: 0.85rem; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Bloco exclusivo para estoque inicial de novos produtos */
        .bloco-estoque-inicial { background: #f1f5f9; padding: 12px; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 15px; }
        .bloco-estoque-inicial h4 { font-size: 0.9rem; color: #475569; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }

        #reader { width: 100%; margin-bottom: 15px; border-radius: 12px; overflow: hidden; display: none; border: 2px solid var(--primary); }
        .btn-scan { width: 100%; background-color: #475569; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
        
        .btn-acao { width: 100%; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background-color: var(--success); }
        .btn-update { background-color: var(--primary); }

        .acoes-container { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        #form-detalhes { display: none; margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 20px; }
        .swal2-popup { border-radius: 15px !important; }
    </style>
</head>
<body>

    <header>
        <button class="btn-voltar-topo" onclick="window.location.href='menu.html'" title="Voltar ao Menu">⬅️</button>
        <span class="titulo-topo">Cadastro de Produtos</span>
        <div style="width: 45px;"></div>
    </header>

    <main>
        <div class="container">
            <!-- BLOCO DE LEITURA -->
            <div class="form-group">
                <label for="codigo_barras">Código de Barras (EAN)</label>
                <input type="text" id="codigo_barras" placeholder="Bipe ou digite o código" oninput="checarDigitacao(this.value)" onchange="buscarProdutoAPI(this.value)">
                
                <div id="reader"></div>
                <button type="button" class="btn-scan" id="btn-toggle-scan">📸 ESCANEAR CÓDIGO</button>
            </div>

            <!-- BLOCO DO FORMULÁRIO -->
            <div id="form-detalhes">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: Farinha de Mandioca">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <div class="grid-cat">
                        <select id="categoria" style="flex: 1;">
                            <option value="">Carregando...</option>
                        </select>
                        <button type="button" class="btn-add-cat" onclick="adicionarNovaCategoria()">+</button>
                    </div>
                </div>

                <!-- MATEMÁTICA DE PREÇOS -->
                <div class="grid-3">
                    <div class="form-group">
                        <label for="preco_custo">Custo (R$)</label>
                        <input type="text" id="preco_custo" placeholder="0,00" onkeyup="formatarMoeda(this); calcularPrecoVenda();">
                    </div>
                    <div class="form-group">
                        <label for="porcentagem_lucro">Margem (%)</label>
                        <input type="number" id="porcentagem_lucro" placeholder="0" onkeyup="calcularPrecoVenda()">
                    </div>
                    <div class="form-group">
                        <label for="preco_venda">Venda (R$)</label>
                        <input type="text" id="preco_venda" placeholder="0,00" onkeyup="formatarMoeda(this); calcularMargem();">
                    </div>
                </div>

                <!-- ESTOQUE INICIAL (Apenas visível se for NOVO produto) -->
                <div class="bloco-estoque-inicial" id="bloco-estoque-novo">
                    <h4>📦 Estoque Inicial (Opcional)</h4>
                    <div class="grid-2">
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label>Quantidade</label>
                            <input type="number" id="ini_qtd" placeholder="Ex: 10" min="1">
                        </div>
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label>Lote</label>
                            <input type="text" id="ini_lote" placeholder="Ex: L123">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Data de Vencimento</label>
                        <input type="text" id="ini_vencimento" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" oninput="mascaraData(this)">
                    </div>
                </div>

                <!-- BOTÕES DINÂMICOS -->
                <div class="acoes-container" id="box-btn-novo">
                    <button class="btn-acao btn-save" onclick="salvarProduto()">💾 SALVAR E ALIMENTAR ESTOQUE</button>
                </div>

                <div class="acoes-container" id="box-btn-editar" style="display: none;">
                    <button class="btn-acao btn-update" onclick="salvarProduto()">🔄 ATUALIZAR PRODUTO</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://lwakjpkjieswatbmukdy.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3YWtqcGtqaWVzd2F0Ym11a2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODg5MzUsImV4cCI6MjEwMjg2NDkzNX0.YIyrALi9r7ZZzN2Diuili-JRewuimKXU7DDDluhoEPM";
        const tabela_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let html5QrCode;
        let produtoExistenteId = null; 

        const readerDiv = document.getElementById('reader');
        const btnScan = document.getElementById('btn-toggle-scan');
        const boxForm = document.getElementById('form-detalhes');
        const boxNovo = document.getElementById('box-btn-novo');
        const boxEditar = document.getElementById('box-btn-editar');
        const selectCategoria = document.getElementById('categoria');
        const blocoEstoqueNovo = document.getElementById('bloco-estoque-novo');

        function mascaraData(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 2) v = v.substring(0, 2) + "/" + v.substring(2);
            if (v.length > 5) v = v.substring(0, 5) + "/" + v.substring(5, 9);
            input.value = v;
        }

        async function carregarCategorias(categoriaSelecionada = "") {
            try {
                const { data, error } = await tabela_supabase.from('categorias').select('nome').order('nome', { ascending: true });
                if (error) throw error;
                selectCategoria.innerHTML = `<option value="">Selecione...</option>` + 
                    data.map(cat => `<option value="${cat.nome}" ${cat.nome === categoriaSelecionada ? 'selected' : ''}>${cat.nome}</option>`).join('');
            } catch (err) { console.error(err); }
        }

        async function adicionarNovaCategoria() {
            const { value: novaCat } = await Swal.fire({ title: 'Nova Categoria', input: 'text', showCancelButton: true, confirmButtonText: 'Salvar' });
            if (novaCat && novaCat.trim() !== "") {
                const nomeFormatado = novaCat.trim();
                const { error } = await tabela_supabase.from('categorias').insert([{ nome: nomeFormatado }]);
                if (!error) await carregarCategorias(nomeFormatado);
            }
        }

        function checarDigitacao(ean) {
            if (ean.length >= 8) buscarProdutoAPI(ean);
            else boxForm.style.display = 'none'; 
        }

        function parseValor(s) { return parseFloat(s.replace("R$ ", "").replace(/\./g, "").replace(",", ".")) || 0; }
        function formataInputMoeda(v) { return v.toFixed(2).replace('.', ','); }
        function formatarMoeda(el) {
            let v = el.value.replace(/\D/g, "");
            v = (v / 100).toFixed(2) + "").replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            el.value = v === "0,00" ? "" : v;
        }

        function calcularPrecoVenda() {
            let custo = parseValor(document.getElementById('preco_custo').value);
            let margem = parseFloat(document.getElementById('porcentagem_lucro').value) || 0;
            if (custo > 0 && margem >= 0) document.getElementById('preco_venda').value = formataInputMoeda(custo + (custo * (margem / 100)));
        }

        function calcularMargem() {
            let custo = parseValor(document.getElementById('preco_custo').value);
            let venda = parseValor(document.getElementById('preco_venda').value);
            if (custo > 0 && venda > custo) document.getElementById('porcentagem_lucro').value = Math.round(((venda - custo) / custo) * 100);
        }

        // --- BUSCA INTELIGENTE E VERIFICAÇÃO DE DUPLICIDADE ---
        async function buscarProdutoAPI(ean) {
            if (!ean || ean.length < 8) return;

            try {
                const { data: prodLocal } = await tabela_supabase.from('produtos').select('*').eq('codigo_barras', ean).maybeSingle();

                if (prodLocal) {
                    // JÁ CADASTRADO: Pergunta se quer ir para a Gestão de Estoque
                    boxForm.style.display = 'none';
                    
                    const resp = await Swal.fire({
                        title: 'Produto já cadastrado!',
                        text: `O item "${prodLocal.nome_produto}" já existe no catálogo. Deseja ser direcionado para a Gestão de Estoque para dar entrada?`,
                        icon: 'info',
                        showCancelButton: true,
                        confirmButtonText: 'Sim, ir para Estoque',
                        cancelButtonText: 'Atualizar dados aqui'
                    });

                    if (resp.isConfirmed) {
                        window.location.href = 'movimentacoes.html';
                        return;
                    }

                    // Se escolheu atualizar aqui mesmo:
                    boxForm.style.display = 'block';
                    produtoExistenteId = prodLocal.id;
                    document.getElementById('nome').value = prodLocal.nome_produto || "";
                    await carregarCategorias(prodLocal.categoria || "");
                    document.getElementById('preco_custo').value = prodLocal.preco_custo ? formataInputMoeda(prodLocal.preco_custo) : "";
                    document.getElementById('porcentagem_lucro').value = prodLocal.porcentagem_lucro || "";
                    document.getElementById('preco_venda').value = prodLocal.preco_venda ? formataInputMoeda(prodLocal.preco_venda) : "";
                    
                    blocoEstoqueNovo.style.display = 'none'; // Esconde estoque inicial pois o produto já existe
                    boxNovo.style.display = 'none';
                    boxEditar.style.display = 'flex';

                } else {
                    // PRODUTO NOVO
                    produtoExistenteId = null;
                    boxForm.style.display = 'block';
                    blocoEstoqueNovo.style.display = 'block'; // Mostra campos de estoque inicial
                    boxNovo.style.display = 'flex';
                    boxEditar.style.display = 'none';
                    
                    await carregarCategorias("");

                    const response = await fetch(`https://br.openfoodfacts.org/api/v0/product/${ean}.json`);
                    const data = await response.json();
                    document.getElementById('nome').value = (data.status === 1 && data.product) ? (data.product.product_name_pt || data.product.product_name || "") : "";
                    document.getElementById('preco_custo').value = "";
                    document.getElementById('porcentagem_lucro').value = "";
                    document.getElementById('preco_venda').value = "";
                    document.getElementById('ini_qtd').value = "";
                    document.getElementById('ini_lote').value = "";
                    document.getElementById('ini_vencimento').value = "";
                }
            } catch (err) { console.log(err); }
        }

        // --- SALVAR / ATUALIZAR ---
        async function salvarProduto() {
            const codigo = document.getElementById('codigo_barras').value.trim();
            const nome = document.getElementById('nome').value.trim();
            const categoria = selectCategoria.value;
            const custo = parseValor(document.getElementById('preco_custo').value);
            const lucro = parseFloat(document.getElementById('porcentagem_lucro').value) || 0;
            const venda = parseValor(document.getElementById('preco_venda').value);

            if (!codigo || !nome || !venda) {
                return Swal.fire('Atenção', 'Código, Nome e Preço de Venda são obrigatórios!', 'warning');
            }

            Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const payload = { codigo_barras: codigo, nome_produto: nome, categoria, preco_custo: custo, porcentagem_lucro: lucro, preco_venda: venda };

            try {
                if (produtoExistenteId) {
                    const { error } = await tabela_supabase.from('produtos').update(payload).eq('id', produtoExistenteId);
                    if (error) throw error;
                    Swal.fire({ title: 'Atualizado!', icon: 'success', timer: 1500, showConfirmButton: false });
                } else {
                    // 1. Salva o Produto
                    const { data: novoProd, error: errProd } = await tabela_supabase.from('produtos').insert([payload]).select().single();
                    if (errProd) throw errProd;

                    // 2. Se informou estoque inicial, já alimenta a prateleira e a movimentação
                    const qtdIni = parseInt(document.getElementById('ini_qtd').value);
                    const loteIni = document.getElementById('ini_lote').value.trim() || 'SEM LOTE';
                    const vencIniRaw = document.getElementById('ini_vencimento').value;

                    if (qtdIni > 0 && vencIniRaw) {
                        const partes = vencIniRaw.split('/');
                        const vencBanco = `${partes[2]}-${partes[1]}-${partes[0]}`;

                        await tabela_supabase.from('prateleira_fisica').insert([{
                            produto_id: novoProd.id, lote: loteIni, quantidade: qtdIni, data_vencimento: vencBanco
                        }]);

                        await tabela_supabase.from('movimentacoes_estoque').insert([{
                            produto_id: novoProd.id, tipo: 'ENTRADA', quantidade: qtdIni, motivo: 'Estoque Inicial de Cadastro'
                        }]);
                    }

                    Swal.fire({ title: 'Salvo e Estoque Alimentado!', icon: 'success', timer: 1500, showConfirmButton: false });
                }
                limparFormulario();
            } catch (err) {
                Swal.fire('Erro', err.message, 'error');
            }
        }

        function limparFormulario() {
            document.getElementById('codigo_barras').value = "";
            produtoExistenteId = null;
            boxForm.style.display = 'none';
            if (readerDiv.style.display !== 'none') stopScanner();
        }

        btnScan.addEventListener('click', () => {
            if (readerDiv.style.display === 'none') {
                html5QrCode = new Html5Qrcode("reader");
                readerDiv.style.display = 'block';
                btnScan.innerHTML = "🛑 PARAR CÂMERA";
                html5QrCode.start(
                    { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        document.getElementById('codigo_barras').value = decodedText;
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopScanner();
                        buscarProdutoAPI(decodedText);
                    }, () => {}
                ).catch(() => stopScanner());
            } else {
                stopScanner();
            }
        });

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
            readerDiv.style.display = 'none';
            btnScan.innerHTML = "📸 ESCANEAR CÓDIGO";
        }
    </script>
</body>
</html>
